name: Deploy to GitHub Pages

# Publishes both apps to one GitHub Pages site:
#   /bulk-xcodedev/          -> activity-tracker-dashboard
#   /bulk-xcodedev/website/  -> website

on:
  push:
    branches: [master]
    paths:
      - 'activity-tracker-dashboard/**'
      - 'website/**'
      - '.github/workflows/deploy-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            activity-tracker-dashboard/package-lock.json
            website/package-lock.json
      - name: Build activity tracker
        working-directory: activity-tracker-dashboard
        run: |
          npm ci
          npm run build
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Combine into one site
        run: |
          mkdir -p _site/website
          cp -r activity-tracker-dashboard/dist/. _site/
          cp -r website/dist/. _site/website/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
